# Configuración de pytest para ClimAPI

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider
pythonpath = .

# Markers
markers =
    slow: Tests que Tardan (>5s)
    integration: Tests de integración
    unit: Tests unitarios
    api: Tests de API FastAPI
    streamlit: Tests de Streamlit

# Fixtures
fixtures = tests/conftest.py

[build]
target = wheel